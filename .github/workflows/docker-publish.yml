name: Docker Build and Publish

on:
  push:
    tags:
      - 'v*'

env:
  # GitHub 容器镜像仓库（官方）
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  # Docker Hub 官方镜像仓库，仓库名固定为 <用户名>/publicapi
  DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/publicapi
  # 未配置 Docker Hub 凭据时自动只推 GHCR，避免发布失败
  DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 设置 Docker Buildx（用于更高效的构建）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GitHub 容器镜像仓库
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 登录 Docker Hub（未配置 secrets 时跳过）
      - name: Log into Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 汇总本次要推送的镜像仓库列表
      - name: Resolve image list
        id: images
        run: |
          images="${GHCR_IMAGE}"
          if [ "${DOCKERHUB_ENABLED}" = "true" ]; then
            images="${images},${DOCKERHUB_IMAGE}"
          else
            echo "::notice title=Docker Hub 已跳过::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次只推送 GHCR"
          fi
          echo "list=${images}" >> "${GITHUB_OUTPUT}"

      # 提取元数据（标签、版本等）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 缓存优化：加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 发布结果写入 Actions 摘要，方便核对两个仓库的镜像地址
      - name: Write summary
        run: |
          {
            echo "## Docker 镜像已发布"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
